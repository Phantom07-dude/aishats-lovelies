<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aishat's Lovelies</title>
<meta name="description" content="Aishat's Lovelies. Watches, rings, earrings, necklaces, bracelets and other accessories from a Nigerian brand.">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#FBF8F2;--cream:#F3ECDF;--gold:#B8975A;--ink:#2B2B2B;--mute:#6B665E;--line:#E4DAC8;--btn:#2B2B2B;--btnt:#FBF8F2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1C19;--cream:#27241F;--gold:#C9A86A;--ink:#F1EBDD;--mute:#B5AD9E;--line:#3A352D;--btn:#F1EBDD;--btnt:#1E1C19}}
:root[data-theme="dark"]{--bg:#1E1C19;--cream:#27241F;--gold:#C9A86A;--ink:#F1EBDD;--mute:#B5AD9E;--line:#3A352D;--btn:#F1EBDD;--btnt:#1E1C19}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Gilda Display',Georgia,serif;font-weight:400;margin:0;line-height:1.15}
h1{font-size:clamp(34px,7vw,58px)}h2{font-size:clamp(26px,4vw,34px)}h3{font-size:19px}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px}
.bar img{width:52px;height:52px;display:block}
.bar form{flex:1 1 180px;display:flex}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:11px 12px;min-height:44px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 24px;background:var(--btn);color:var(--btnt);border:0;font:500 16px Figtree,sans-serif;cursor:pointer}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sec{padding:56px 0}.cr{background:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;margin-top:24px}
.card{display:block}.ph{position:relative;aspect-ratio:4/5;background:var(--cream);border:1px solid var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tg{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.tg span{background:var(--bg);border:1px solid var(--gold);font-size:12px;padding:1px 8px}
.card small,.mute{color:var(--mute)}.card h3{margin:8px 0 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips a{border:1px solid var(--line);padding:9px 16px;min-height:44px;display:inline-flex;align-items:center}
.chips a.on{border-color:var(--gold);background:var(--cream)}
.empty{border:1px solid var(--line);background:var(--cream);padding:40px 20px;text-align:center;margin-top:24px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row img{width:64px;height:80px;object-fit:cover}
.q{display:inline-flex;align-items:center;border:1px solid var(--line)}.q button{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}.q span{min-width:32px;text-align:center}
.note{border-left:3px solid var(--gold);background:var(--cream);padding:12px 16px;margin:16px 0}
.err{border-color:#B3261E}
label{display:block;margin:14px 0 4px;font-weight:500}
footer{border-top:1px solid var(--line);padding:36px 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><div class="w bar">
<a href="#/" aria-label="Aishat's Lovelies home"><img src="logo.jpg" alt="Aishat's Lovelies logo"></a>
<nav style="display:flex;gap:18px"><a href="#/shop">Shop</a><a href="#/shop?cat=New">New</a></nav>
<form id="sf" role="search"><input id="q" type="search" placeholder="Search products" aria-label="Search products"><button class="btn" style="margin-left:6px;padding:10px 16px">Search</button></form>
<a href="#/cart" aria-label="Cart" style="font-weight:500">Cart (<span id="cc">0</span>)</a>
</div></header>
<main id="app"><div class="w sec"><p class="mute">Loading...</p></div></main>
<footer><div class="w two">
<div><h3>Aishat's Lovelies</h3><p class="mute">Stay lovely, Shine Bi Ori Ade....</p><p class="mute">Orders are placed and confirmed on WhatsApp. An order is only confirmed once Aishat replies to confirm it.</p></div>
<div><p><a href="https://wa.me/2349016595841" target="_blank" rel="noopener">WhatsApp: +234 901 659 5841</a></p><p><a href="https://x.com/n_aeesha" target="_blank" rel="noopener">X: @n_aeesha</a></p><p><a id="adm" href="#/admin" hidden>Manage products</a></p></div>
</div></footer>
<script>
const SB='https://cblkxyddmvchgtaedabk.supabase.co',KEY='sb_publishable_x-hfASJwec9HTwDlOwtJJg_W9bDl_ce',WA='2349016595841',CATS=['Watches','Rings','Earrings','Necklaces','Bracelets','Other Accessories'],PUB=SB+'/storage/v1/object/public/product-images/';
let ALL=[],P=[],cart={},co=null,notes=[],ses=null,ed=null,fb=null,busy=false,bad=false;
try{cart=JSON.parse(localStorage.getItem('al_cart')||'{}');ses=JSON.parse(localStorage.getItem('al_ses')||'null')}catch(e){}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ngn=n=>'₦'+Number(n).toLocaleString('en-NG');
const save=()=>{try{localStorage.setItem('al_cart',JSON.stringify(cart))}catch(e){}};
const byId=id=>P.find(p=>p.id===id);
const age=p=>(Date.now()-p.added)/864e5;
const isNew=p=>p.isnew==null?age(p)<=14:p.isnew;
const tags=p=>[isNew(p)&&'New',p.featured&&'Featured',age(p)>14&&age(p)<=30&&'Recently Added'].filter(Boolean);
const stk=p=>p.stock<1?'Out of stock':p.stock<=3?'Only '+p.stock+' left':'In stock';
const empty=t=>`<div class="empty"><p style="margin:0">${t}</p></div>`;
const disp=s=>typeof s==='string'?s:s.u;
const fbHtml=()=>{const f=fb;fb=null;return f?`<p class="note ${f.ok?'':'err'}" role="status">${esc(f.t)}</p>`:''};
const setSes=d=>{ses=d?{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+d.expires_in,email:(d.user||{}).email||''}:null;try{ses?localStorage.setItem('al_ses',JSON.stringify(ses)):localStorage.removeItem('al_ses')}catch(e){}};
async function api(path,o={}){
const auth=path.startsWith('/auth/');
if(ses&&!auth&&ses.expires_at-60<Date.now()/1000){try{setSes(await api('/auth/v1/token?grant_type=refresh_token',{m:'POST',h:{'Content-Type':'application/json'},b:JSON.stringify({refresh_token:ses.refresh_token})}))}catch(e){setSes(null)}}
const h={apikey:KEY,...(o.h||{})};if(ses&&!auth)h.Authorization='Bearer '+ses.access_token;
const r=await fetch(SB+path,{method:o.m||'GET',headers:h,body:o.b});
if(!r.ok){let t='';try{const j=await r.json();t=j.message||j.msg||j.error_description||j.error||''}catch(e){}throw new Error(t||('Request failed ('+r.status+')'))}
if(r.status===204)return null;return (r.headers.get('content-type')||'').includes('json')?r.json():null}
const mapP=r=>({id:r.id,name:r.name,desc:r.description||'',cat:r.category,price:r.price,stock:r.stock,images:r.images||[],featured:r.featured,hidden:!r.visible,isnew:r.is_new,added:Date.parse(r.created_at)});
async function load(){try{const r=await api('/rest/v1/products?select=*&order=created_at.desc');ALL=r.map(mapP);P=ALL.filter(p=>!p.hidden);bad=false}catch(e){bad=true}}
const card=p=>`<a class="card" href="#/p/${p.id}"><div class="ph">${p.images[0]?`<img src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="tg">${tags(p).map(t=>`<span>${t}</span>`).join('')}</div></div><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3><b>${ngn(p.price)}</b> <small>${stk(p)}</small></a>`;
const total=()=>Object.keys(cart).reduce((s,id)=>s+(byId(id)?byId(id).price*cart[id]:0),0);
function clean(){const n=[];for(const id in cart){const p=byId(id);if(!p||p.stock<1){n.push((p?p.name:'An item')+' is no longer available and was removed from your cart.');delete cart[id]}else if(cart[id]>p.stock){n.push(p.name+' quantity was lowered to the '+p.stock+' available.');cart[id]=p.stock}}save();return n}
function count(){$('#cc').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function add(id){const p=byId(id),q=Math.max(1,+($('#qty')?.value||1));if(!p||p.stock<1)return;cart[id]=Math.min(p.stock,(cart[id]||0)+q);save();count();location.hash='#/cart'}
function setQ(id,d){const p=byId(id);if(!p)return;const n=(cart[id]||0)+d;if(n<1)delete cart[id];else cart[id]=Math.min(n,p.stock);save();route(1)}
function rm(id){delete cart[id];save();route(1)}
function img(s){$('#main').src=s}
function stepQ(d,m){const e=$('#qty');e.value=Math.min(m,Math.max(1,+e.value+d))}
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q').value)};
function home(){const f=P.filter(p=>p.featured&&p.stock>0).slice(0,8),n=P.slice(0,8);
return `<section class="cr"><div class="w two" style="padding-top:48px;padding-bottom:48px;align-items:center"><div><h1>Stay lovely, Shine Bi Ori Ade....</h1><p class="mute" style="max-width:440px;margin:18px 0 26px">Watches, rings, earrings, necklaces, bracelets and other accessories from a Nigerian brand.</p><a class="btn" href="#/shop">Shop Now</a></div><img src="logo.jpg" alt="" style="width:min(240px,70%);justify-self:center"></div></section>
<section class="sec"><div class="w"><h2>Shop by category</h2><div class="chips" style="margin-top:20px">${CATS.map(c=>`<a href="#/shop?cat=${encodeURIComponent(c)}">${c}</a>`).join('')}</div></div></section>
<section class="sec cr"><div class="w"><h2>Featured</h2>${f.length?`<div class="grid">${f.map(card).join('')}</div>`:empty('Our featured pieces are coming soon. Please check back.')}</div></section>
<section class="sec"><div class="w"><h2>New arrivals</h2>${n.length?`<div class="grid">${n.map(card).join('')}</div>`:empty('New pieces are on the way. Please check back soon.')}</div></section>
<section class="sec cr"><div class="w" style="max-width:640px"><h2>About us</h2><p>Aishat's Lovelies is a Nigerian accessories brand. You choose your pieces here, send your order on WhatsApp, and Aishat confirms the details with you directly.</p></div></section>`}
function shop(sp){const cat=sp.get('cat')||'',q=(sp.get('q')||'').toLowerCase(),s=sp.get('sort')||'new';let l=P.filter(p=>(cat==='New'?age(p)<=30:!cat||p.cat===cat)&&(!q||(p.name+' '+p.cat+' '+p.desc).toLowerCase().includes(q)));
l.sort(s==='lo'?(a,b)=>a.price-b.price:s==='hi'?(a,b)=>b.price-a.price:(a,b)=>b.added-a.added);
const u=o=>'#/shop?'+new URLSearchParams({cat,q:sp.get('q')||'',sort:s,...o});
return `<div class="w sec"><h2>${esc(cat==='New'?'New arrivals':cat||'All products')}${q?' matching "'+esc(sp.get('q'))+'"':''}</h2><div class="chips" style="margin:20px 0"><a href="${u({cat:''})}" class="${cat?'':'on'}">All</a>${CATS.map(c=>`<a href="${u({cat:c})}" class="${cat===c?'on':''}">${c}</a>`).join('')}</div>
<label for="so" style="margin:0 0 4px">Sort by</label><select id="so" style="max-width:240px" onchange="location.hash=this.value"><option value="${u({sort:'new'})}" ${s==='new'?'selected':''}>Newest</option><option value="${u({sort:'lo'})}" ${s==='lo'?'selected':''}>Price, low to high</option><option value="${u({sort:'hi'})}" ${s==='hi'?'selected':''}>Price, high to low</option></select>
${l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty(P.length?'No products match your search. Try another category or word.':'Our collection is coming soon. Please check back.')}</div>`}
function prod(id,pre){const p=pre?(id==='draft'?ed&&{...ed,images:ed.images.map(disp),added:ed.added||Date.now()}:ALL.find(x=>x.id===id)):byId(id);if(!p)return `<div class="w sec">${empty('This product could not be found.')}<p style="text-align:center"><a class="btn" href="#/shop">Back to shop</a></p></div>`;
const rel=P.filter(r=>r.cat===p.cat&&r.id!==p.id&&r.stock>0).slice(0,4),ok=p.stock>0;
return `<div class="w sec"><div class="two"><div><div class="ph">${p.images[0]?`<img id="main" src="${esc(p.images[0])}" alt="${esc(p.name)}">`:''}</div><div style="display:flex;gap:8px;margin-top:8px">${p.images.length>1?p.images.map(s=>`<img src="${esc(s)}" alt="" onclick="img(this.src)" style="width:64px;height:80px;object-fit:cover;cursor:pointer;border:1px solid var(--line)">`).join(''):''}</div></div>
<div><small class="mute">${esc(p.cat)}</small><h1 style="font-size:36px;margin:6px 0">${esc(p.name)}</h1><p style="font-size:22px;margin:0 0 6px"><b>${ngn(p.price)}</b></p><p class="mute" style="margin:0 0 16px">${stk(p)}</p><p style="white-space:pre-line">${esc(p.desc)}</p>
${ok?`<label for="qty">Quantity (up to ${p.stock})</label><div class="q"><button onclick="stepQ(-1,${p.stock})" aria-label="Fewer">−</button><input id="qty" type="number" min="1" max="${p.stock}" value="1" style="width:64px;border:0;text-align:center"><button onclick="stepQ(1,${p.stock})" aria-label="More">+</button></div><p><button class="btn" onclick="add('${p.id}')">Add to cart</button></p>`:`<p class="note">This item is out of stock right now. Please check back soon.</p><button class="btn" disabled>Unavailable</button>`}</div></div>
${rel.length?`<h2 style="margin-top:56px">You may also like</h2><div class="grid">${rel.map(card).join('')}</div>`:''}</div>`}
function cartV(){const n=[...notes,...clean()];notes=[];const ids=Object.keys(cart);
return `<div class="w sec"><h2>Your cart</h2>${n.map(t=>`<p class="note">${esc(t)}</p>`).join('')}${ids.length?ids.map(id=>{const p=byId(id);return `<div class="row">${p.images[0]?`<img src="${esc(p.images[0])}" alt="">`:''}<div style="flex:1 1 160px"><h3>${esc(p.name)}</h3><span class="mute">${ngn(p.price)} each</span></div><div class="q"><button onclick="setQ('${id}',-1)" aria-label="Fewer">−</button><span>${cart[id]}</span><button onclick="setQ('${id}',1)" aria-label="More" ${cart[id]>=p.stock?'disabled':''}>+</button></div><b style="min-width:90px;text-align:right">${ngn(p.price*cart[id])}</b><button class="btn o" onclick="rm('${id}')">Remove</button></div>`}).join('')+`<p style="text-align:right;font-size:22px">Total: <b>${ngn(total())}</b></p><p style="text-align:right"><a class="btn" href="#/checkout">Continue to checkout</a></p>`:empty('Your cart is empty. <a href="#/shop" style="text-decoration:underline">Browse the shop</a>')}</div>`}
const summary=()=>Object.keys(cart).map(id=>{const p=byId(id);return `<div class="row"><span style="flex:1">${esc(p.name)} × ${cart[id]}</span><span class="mute">${ngn(p.price)} each</span><b>${ngn(p.price*cart[id])}</b></div>`}).join('')+`<p style="text-align:right;font-size:20px">Order total: <b>${ngn(total())}</b></p>`;
function msg(){const L=Object.keys(cart).map((id,i)=>{const p=byId(id);return `${i+1}. ${p.name}, ${cart[id]} x ${ngn(p.price)} = ${ngn(p.price*cart[id])}`});
return `Hello Aishat's Lovelies, I would like to place an order (pending your confirmation).\n\nItems:\n${L.join('\n')}\n\nTotal: ${ngn(total())}\n\nName: ${co.name}\nPhone: ${co.phone}\nDelivery address: ${co.addr}${co.note?'\nNote: '+co.note:''}`}
function checkout(){notes=clean();if(notes.length)return cartV();if(!Object.keys(cart).length)return cartV();
if(co&&co.ok){const m=msg();return `<div class="w sec" style="max-width:680px"><h2>Review your order</h2>${summary()}<p><b>${esc(co.name)}</b><br>${esc(co.phone)}<br>${esc(co.addr)}${co.note?'<br>Note: '+esc(co.note):''}</p><p class="note">Your order is not placed yet. It stays pending until you send the message below on WhatsApp and Aishat confirms it. No payment has been taken, and stock is not reserved until she confirms.</p><pre style="white-space:pre-wrap;background:var(--cream);padding:14px;font:inherit;border:1px solid var(--line)">${esc(m)}</pre><p style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(m)}">Send order on WhatsApp</a><button class="btn o" onclick="co.ok=false;route(1)">Edit details</button></p></div>`}
const c=co||{};return `<div class="w sec" style="max-width:680px"><h2>Checkout</h2>${summary()}<form onsubmit="return go(event)"><label for="n">Full name</label><input id="n" required value="${esc(c.name)}"><label for="ph">Phone number</label><input id="ph" type="tel" required value="${esc(c.phone)}"><label for="ad">Delivery address</label><textarea id="ad" rows="3" required>${esc(c.addr)}</textarea><label for="nt">Order note (optional)</label><textarea id="nt" rows="2">${esc(c.note)}</textarea><p><button class="btn">Review order</button></p></form></div>`}
async function go(e){e.preventDefault();co={name:$('#n').value.trim(),phone:$('#ph').value.trim(),addr:$('#ad').value.trim(),note:$('#nt').value.trim(),ok:false};await load();notes=clean();if(notes.length){location.hash='#/cart';return false}co.ok=true;route(1);return false}
const say=(t,ok=1)=>{fb={t,ok};route(1)};
const blank=()=>({name:'',price:'',cat:CATS[0],stock:'',desc:'',featured:false,hidden:false,isnew:null,images:[],orig:[]});
function shrink(f){return new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>r(b?{f:b,u:URL.createObjectURL(b)}:null),'image/jpeg',.85)};i.onerror=()=>r(null);i.src=u})}
async function login(e){e.preventDefault();try{setSes(await api('/auth/v1/token?grant_type=password',{m:'POST',h:{'Content-Type':'application/json'},b:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})}));await load();say('Signed in.')}catch(err){say('Could not sign in. Check the email and password.',0)}return false}
function logout(){setSes(null);ed=null;load().then(()=>{location.hash='#/';route()})}
function grab(){if(!$('#an')||!ed)return;Object.assign(ed,{name:$('#an').value,price:$('#ap').value,cat:$('#ac').value,stock:$('#as').value,desc:$('#ad2').value,isnew:{auto:null,yes:true,no:false}[$('#al').value],featured:$('#af').checked,hidden:!$('#av').checked})}
function edit(id){if(id){const p=ALL.find(x=>x.id===id);ed={...p,images:[...p.images],orig:[...p.images]}}else ed=blank();route(1)}
async function pick(f){if(!(f.type||'').startsWith('image/')&&!/\.(jpe?g|png|webp)$/i.test(f.name)){fb={t:'Only JPG, PNG or WebP photos are allowed.',ok:0};return null}if(f.size>12e6){fb={t:f.name+' is over 12 MB. Choose a smaller photo.',ok:0};return null}const d=await shrink(f);if(!d)fb={t:'That photo could not be read. Use a JPG, PNG or WebP image (iPhone HEIC photos are not supported).',ok:0};return d}
async function addImg(el){grab();for(const f of el.files){if(ed.images.length>=4){fb={t:'You can add up to 4 photos.',ok:0};break}const s=await pick(f);if(s)ed.images.push(s)}route(1)}
async function repImg(i,el){grab();const s=el.files[0]&&await pick(el.files[0]);if(s)ed.images[i]=s;route(1)}
function rmImg(i){grab();ed.images.splice(i,1);route(1)}
async function cleanImgs(urls){for(const u of urls){if(u.startsWith(PUB))try{await api('/storage/v1/object/product-images/'+u.slice(PUB.length),{m:'DELETE'})}catch(e){}}}
async function saveP(e){e.preventDefault();if(busy)return false;grab();const p=ed,pr=Number(p.price),st=Number(p.stock);
if(!p.name.trim())return say('Enter a product name.',0),false;
if(p.price===''||!Number.isInteger(pr)||pr<0)return say('Price must be a whole number in naira, 0 or more.',0),false;
if(p.stock===''||!Number.isInteger(st)||st<0)return say('Stock must be a whole number, 0 or more.',0),false;
if(!p.images.length)return say('Add at least one photo.',0),false;
busy=true;try{const urls=[];for(const s of p.images){if(typeof s==='string')urls.push(s);else{const path=crypto.randomUUID()+'.jpg';await api('/storage/v1/object/product-images/'+path,{m:'POST',h:{'Content-Type':'image/jpeg'},b:s.f});urls.push(PUB+path)}}
const body=JSON.stringify({name:p.name.trim(),description:p.desc.trim(),category:p.cat,price:pr,stock:st,images:urls,featured:!!p.featured,visible:!p.hidden,is_new:p.isnew});
const H={'Content-Type':'application/json'};
if(p.id)await api('/rest/v1/products?id=eq.'+p.id,{m:'PATCH',h:H,b:body});else await api('/rest/v1/products',{m:'POST',h:H,b:body});
await cleanImgs((p.orig||[]).filter(u=>!urls.includes(u)));ed=null;await load();busy=false;say('Product saved. It is live on the store now.')}catch(err){busy=false;say('Could not save: '+err.message,0)}return false}
async function patch(id,body,okMsg){try{await api('/rest/v1/products?id=eq.'+id,{m:'PATCH',h:{'Content-Type':'application/json'},b:JSON.stringify(body)});await load();say(okMsg)}catch(err){say('Could not update: '+err.message,0)}}
function tog(id,k){const p=ALL.find(x=>x.id===id);if(k==='hidden')patch(id,{visible:p.hidden},p.name+(p.hidden?' is now visible in the store.':' is now hidden from the store.'));else patch(id,{featured:!p.featured},p.name+(p.featured?' is no longer featured.':' is now featured.'))}
function setStock(id,v){const p=ALL.find(x=>x.id===id),n=Number(v);if(v===''||!Number.isInteger(n)||n<0)return say('Stock must be a whole number, 0 or more.',0);patch(id,{stock:n},'Stock for '+p.name+' is now '+n+'.')}
async function delP(id){const p=ALL.find(x=>x.id===id);if(!confirm('Delete "'+p.name+'"? This cannot be undone.'))return;try{await api('/rest/v1/products?id=eq.'+id,{m:'DELETE'});await cleanImgs(p.images);await load();say('Product deleted.')}catch(err){say('Could not delete: '+err.message,0)}}
function form(){const p=ed,hid='position:absolute;opacity:0;width:1px;height:1px';return `<form onsubmit="return saveP(event)" style="border:1px solid var(--line);padding:16px;margin:16px 0;background:var(--cream)"><h3>${p.id?'Edit product':'New product'}</h3>
<label for="an">Product name</label><input id="an" required maxlength="80" value="${esc(p.name)}">
<label for="ap">Price (₦)</label><input id="ap" type="number" min="0" step="1" required value="${esc(p.price)}">
<label for="ac">Category</label><select id="ac">${CATS.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select>
<label for="as">Available stock</label><input id="as" type="number" min="0" step="1" required value="${esc(p.stock)}">
<label for="ad2">Description</label><textarea id="ad2" rows="3" maxlength="800">${esc(p.desc)}</textarea>
<label>Photos (up to 4, JPG, PNG or WebP)</label><div style="display:flex;gap:12px;flex-wrap:wrap">${p.images.map((s,i)=>`<div style="position:relative"><img src="${esc(disp(s))}" alt="" style="width:80px;height:100px;object-fit:cover;display:block"><label class="btn o" style="min-height:36px;padding:2px 8px;margin:4px 0;font-weight:400">Replace<input type="file" accept="image/*" style="${hid}" onchange="repImg(${i},this)"></label><button type="button" class="btn o" style="min-height:36px;padding:2px 8px" onclick="rmImg(${i})">Remove</button></div>`).join('')}</div>
<input type="file" accept="image/*" multiple onchange="addImg(this)" style="margin-top:10px" aria-label="Add photos">
<label for="al">New label</label><select id="al"><option value="auto" ${p.isnew==null?'selected':''}>Automatic (shows for 14 days after adding)</option><option value="yes" ${p.isnew===true?'selected':''}>Always show New</option><option value="no" ${p.isnew===false?'selected':''}>Never show New</option></select>
<label><input id="af" type="checkbox" style="width:auto;min-height:0" ${p.featured?'checked':''}> Featured on the home page</label>
<label><input id="av" type="checkbox" style="width:auto;min-height:0" ${p.hidden?'':'checked'}> Visible on the storefront</label>
<p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" ${busy?'disabled':''}>${busy?'Saving...':'Save product'}</button><a class="btn o" href="#/preview/draft" onclick="grab()">Preview</a><button type="button" class="btn o" onclick="ed=null;route(1)">Cancel</button></p></form>`}
function admin(){if(!ses)return `<div class="w sec" style="max-width:420px"><h2>Admin sign in</h2>${fbHtml()}<form onsubmit="return login(event)"><label for="em">Email</label><input id="em" type="email" required autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"><p><button class="btn">Sign in</button></p></form></div>`;
const box=(v,l)=>`<div style="flex:1 1 130px;border:1px solid var(--line);background:var(--cream);padding:14px"><div style="font:28px 'Gilda Display',serif">${v}</div><small class="mute">${l}</small></div>`;
return `<div class="w sec"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>Admin</h2><span class="mute">${esc(ses.email)} <button class="btn o" style="min-height:36px;padding:2px 14px" onclick="logout()">Sign out</button></span></div>${fbHtml()}
<div style="display:flex;gap:12px;flex-wrap:wrap;margin:20px 0">${box(ALL.length,'Total products')}${box(ALL.filter(p=>!p.hidden&&p.stock>0).length,'Active products')}${box(ALL.filter(p=>p.stock<1).length,'Out of stock')}${box(ALL.filter(p=>age(p)<=14).length,'Added in the last 14 days')}</div>
<p><button class="btn" onclick="edit()">Add product</button></p>${ed?form():''}
<h2 style="margin-top:32px">Products</h2>${ALL.length?ALL.map(p=>`<div class="row">${p.images[0]?`<img src="${esc(p.images[0])}" alt="">`:''}<div style="flex:1 1 170px"><b>${esc(p.name)}</b><br><span class="mute">${ngn(p.price)}, ${esc(p.cat)}<br>${[p.hidden?'Hidden':'Visible',p.featured?'Featured':'',p.stock<1?'Out of stock':''].filter(Boolean).join(', ')}</span></div><label style="margin:0">Stock <input type="number" min="0" step="1" value="${p.stock}" style="width:84px" onchange="setStock('${p.id}',this.value)"></label><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn o" onclick="edit('${p.id}')">Edit</button><a class="btn o" href="#/preview/${p.id}">Preview</a><button class="btn o" onclick="tog('${p.id}','hidden')">${p.hidden?'Show':'Hide'}</button><button class="btn o" onclick="tog('${p.id}','featured')">${p.featured?'Unfeature':'Feature'}</button><button class="btn o" onclick="setStock('${p.id}',0)" ${p.stock<1?'disabled':''}>Out of stock</button><button class="btn o" onclick="delP('${p.id}')">Delete</button></span></div>`).join(''):empty('No products yet. Press Add product to create your first one.')}</div>`}
async function route(skip){const[h,qs]=(location.hash.slice(1)||'/').split('?'),sp=new URLSearchParams(qs||''),m=h.split('/');
if(!skip&&(h==='/cart'||h==='/checkout'||h==='/admin'||m[1]==='p'))await load();
$('#adm').hidden=!ses;let v;
if(bad&&!ses&&h!=='/admin')v=`<div class="w sec">${empty('We could not load the shop right now. Please refresh the page in a moment.')}</div>`;
else if(h==='/shop')v=shop(sp);else if(m[1]==='p')v=prod(m[2]);else if(h==='/cart')v=cartV();else if(h==='/checkout')v=checkout();else if(h==='/admin')v=admin();
else if(m[1]==='preview'&&ses)v=`<div class="w" style="padding-top:16px"><p class="note">Preview of the product page. Customers see it once the product is saved and visible. <a href="#/admin" style="text-decoration:underline">Back to admin</a></p></div>`+prod(m[2],1);
else v=home();
app.innerHTML=v;count();if(!skip)window.scrollTo(0,0)}
addEventListener('hashchange',()=>route());
load().then(()=>route());
</script>
</body>
</html>
